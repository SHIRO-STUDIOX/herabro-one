# Development overrides — automatically loaded by `docker compose up --build`
# Enables Live-reload for Django and Vite HMR for Vue

services:
  # ── Django Backend (dev mode) ──
  backend:
    build:
      context: ./hesabro-one-backend-django
      dockerfile: Dockerfile
    env_file: ./hesabro-one-backend-django/.env
    environment:
      DEBUG: "True"
    volumes:
      - ./hesabro-one-backend-django:/app
      - static_files:/app/staticfiles
      - media_files:/app/media
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  # ── Vue Frontend (Vite dev server with HMR) ──
  frontend:
    build:
      context: ./hesabro-one-frontend-vue
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./hesabro-one-frontend-vue:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "${FRONTEND_PORT:-8085-8099}:8080"

  # ── Nginx (dev config with Vite HMR proxy) ──
  nginx:
    build:
      context: ./hesabro-one-backend-django/docker/nginx
      dockerfile: Dockerfile
    volumes:
      - ./hesabro-one-backend-django/docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
